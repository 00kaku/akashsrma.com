# Checks, tests and builds every push and pull request. A push to a deploy branch that passes is
# deployed to Hostinger:
#   staging → the `staging` environment (staging.akashsrma.com)
#   master  → the `production` environment (akashsrma.com)
#
# The server can't build, so the packages' build/ and vendor/ are committed; the build job fails if
# they differ from a fresh build. Deploying asks the server to pull: the deploy key is a
# forced-command key that can only run `~/bin/deploy-pull <domain>`, which backs up the database,
# fast-forwards the server's checkout to the branch and purges the cache. Run this workflow by hand
# with `rollback` to return a site to the commit that was live before its last deploy.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_PORT, SSH_USER   Hostinger's SSH login
#   SSH_KEY_PRODUCTION             forced-command deploy key for akashsrma.com (master)
#   SSH_KEY_STAGING                forced-command deploy key for staging.akashsrma.com (staging)
# Each site has its own key because the key's forced command names the site. Without them the
# deploy job skips itself.

name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: pull deploys the branch; rollback returns to the commit live before the last deploy
        type: choice
        options: [pull, rollback]
        default: pull

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, static analysis, JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:2.8.6
      - run: npm ci
      - run: composer install --no-interaction --no-progress
      - run: npm run lint
      - run: npm run test:js

  phpunit:
    name: PHPUnit (WordPress integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:2.8.6
      - run: npm ci
      - run: composer install --no-interaction --no-progress
      - run: npm run env:start
      - run: npm run test:php

  build:
    name: Committed build matches the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # The same Composer as local builds, so the generated autoloaders match byte for byte.
          tools: composer:2.8.6
      - run: npm ci
      - run: npm run build
      - name: Compare with git
        run: |
          changes=$(git status --porcelain -- plugins themes)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff --stat -- plugins themes
            echo "::error::build/ or vendor/ differ from a fresh build. Run 'npm run build' and commit the result."
            exit 1
          fi
          echo "build/ and vendor/ match the source."

  deploy:
    name: Deploy to Hostinger (${{ github.ref_name }})
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    needs: [checks, phpunit, build]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ github.ref == 'refs/heads/master' && secrets.SSH_KEY_PRODUCTION || secrets.SSH_KEY_STAGING }}
      ACTION: ${{ inputs.action || 'pull' }}
    steps:
      - name: Check deploy settings
        id: settings
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::notice::Deploy skipped: add the SSH_* secrets to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ask the server to ${{ env.ACTION }}
        if: steps.settings.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The key's forced command picks the site; the command sent here is only the action.
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "$ACTION"
