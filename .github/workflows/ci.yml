# Checks, tests and builds every push and pull request. A push that passes is deployed to Hostinger:
#   staging → the `staging` environment (staging.akashsrma.com)
#   master  → the `production` environment (akashsrma.com)
#
# Deploy needs these secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST          Hostinger's SSH host                                     (repository secret)
#   SSH_PORT          its SSH port (Hostinger uses 65002)                      (repository secret)
#   SSH_USER          the SSH user                                             (repository secret)
#   SSH_PRIVATE_KEY   a private key whose public half is added in hPanel → SSH Access (repository secret)
#   WP_CONTENT_PATH   that site's wp-content folder, set in each environment (Settings → Environments)
# Without them the deploy job skips itself.

name: CI

on:
  push:
    branches: [master, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, static analysis, JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: npm ci
      - run: composer install --no-interaction --no-progress
      - run: npm run lint
      - run: npm run test:js

  phpunit:
    name: PHPUnit (WordPress integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: npm ci
      - run: composer install --no-interaction --no-progress
      - run: npm run build
      - run: npm run env:start
      - run: npm run test:php

  build:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: npm ci
      - run: npm run build
      # The release is the built theme and plugin, without block sources.
      - name: Assemble release
        run: |
          mkdir -p release/themes release/plugins
          rsync -a --exclude src --exclude node_modules themes/magazine release/themes/
          rsync -a --exclude src --exclude node_modules plugins/akashsrma-features release/plugins/
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
          retention-days: 14

  deploy:
    name: Deploy to Hostinger (${{ github.ref_name }})
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    needs: [checks, phpunit, build]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      WP_CONTENT_PATH: ${{ secrets.WP_CONTENT_PATH }}
    steps:
      - name: Check deploy settings
        id: settings
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$WP_CONTENT_PATH" ]; then
            echo "::notice::Deploy skipped: add the SSH_* and WP_CONTENT_PATH secrets to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.settings.outputs.ready == 'true'
        with:
          name: release
          path: release
      - name: Set up SSH
        if: steps.settings.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Upload theme and plugin
        if: steps.settings.outputs.ready == 'true'
        run: |
          ssh_cmd="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-22}"
          rsync -az --delete -e "$ssh_cmd" release/themes/magazine/ "$SSH_USER@$SSH_HOST:$WP_CONTENT_PATH/themes/magazine/"
          rsync -az --delete -e "$ssh_cmd" release/plugins/akashsrma-features/ "$SSH_USER@$SSH_HOST:$WP_CONTENT_PATH/plugins/akashsrma-features/"
